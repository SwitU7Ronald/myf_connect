name: methodist_connect
description: "A Methodist Connect app for community communication and organization management."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.0

# Runtime dependencies used by the app
dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  cloud_firestore: ^6.0.0

  # State management
  provider: ^6.1.5+1

  # Utilities
  intl: ^0.20.2

# Dev-only dependencies (testing, linting, build tools)
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Flutter-specific configuration
flutter:
  uses-material-design: true

  # Add assets here when ready
  # assets:
  #   - assets/images/
  #   - assets/icons/

  # Add custom fonts here when ready
  # fonts:
  #   - family: Montserrat
  #     fonts:
  #       - asset: assets/fonts/Montserrat-Regular.ttf
  #       - asset: assets/fonts/Montserrat-SemiBold.ttf
  #         weight: 600
