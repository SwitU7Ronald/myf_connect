include: package:flutter_lints/flutter.yaml
analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    use_build_context_synchronously: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
    - android/**
    - macos/**
    - ios/**
    - web/**
    - windows/**
    - linux/**
linter:
  rules:
    - avoid_print
    - use_key_in_widget_constructors
    - always_use_package_imports
