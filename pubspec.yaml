name: myf_connect
description: "A MYF Connect app for community communication and organization management."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.0

# Runtime dependencies used by the app
dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^2.0.0

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  cloud_firestore: ^6.0.0
  google_sign_in: ^7.2.0



  # Utilities
  intl: ^0.20.2
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  get_it: ^9.2.1
  bloc: ^9.2.1
  permission_handler: ^13.0.2
  go_router: ^18.0.2
  firebase_crashlytics: ^5.4.0
  flutter_dotenv: ^6.0.1
  google_fonts: ^9.0.0

# Dev-only dependencies (testing, linting, build tools)
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  comments_remover: ^1.0.2
  mockito: ^5.8.1
  build_runner: ^2.16.1
  bloc_test: ^10.0.0

# Flutter-specific configuration
flutter:
  uses-material-design: true

  # Add assets here when ready
  assets:
    - assets/
    - .env

  # Add custom fonts here when ready
  # fonts:
  #   - family: Montserrat
  #     fonts:
  #       - asset: assets/fonts/Montserrat-Regular.ttf
  #       - asset: assets/fonts/Montserrat-SemiBold.ttf
  #         weight: 600
